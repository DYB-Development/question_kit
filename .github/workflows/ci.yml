name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      RUBY_VERSION: 3.3.5
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.RUBY_VERSION }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Check the coding agent locals hold their format
        run: bundle exec rake the_local:check

  test:
    runs-on: ubuntu-24.04

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.5
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/test

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  easy_flow_range:
    name: test (${{ matrix.edge }} easy_flow allowed)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edge: [ lowest, newest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.5

      - name: Pick the ${{ matrix.edge }} easy_flow release question_kit allows
        run: |
          version=$(ruby -e '
            requirement = Gem::Specification.load("question_kit.gemspec").dependencies.find { |dependency| dependency.name == "easy_flow" }.requirement
            released = `gem list --remote --all --exact easy_flow`[/\((.*)\)/, 1].split(", ").map { |number| Gem::Version.new(number) }
            allowed = released.select { |version| requirement.satisfied_by?(version) && !version.prerelease? }
            puts ARGV.first == "lowest" ? allowed.min : allowed.max
          ' ${{ matrix.edge }})
          echo "EASY_FLOW_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install gems with easy_flow ${{ env.EASY_FLOW_VERSION }}
        run: bundle update easy_flow --conservative

      - name: Run tests against easy_flow ${{ env.EASY_FLOW_VERSION }}
        env:
          RAILS_ENV: test
        run: bin/test || { echo "::error::Tests failed against easy_flow $EASY_FLOW_VERSION"; exit 1; }
